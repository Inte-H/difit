name: Fork Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.repository == 'duru-app/difit'
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub release
    if: github.repository == 'duru-app/difit' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Pack with fork version
        id: pack
        run: |
          V="$(node -p "require('./package.json').version")-inteh.${{ github.run_number }}"
          npm pkg set version="$V"
          npm pack --ignore-scripts
          cp "difit-$V.tgz" difit.tgz
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.pack.outputs.version }}
        run: gh release create "v$V" "difit-$V.tgz" difit.tgz --target "$GITHUB_SHA" --title "v$V" --generate-notes
